[project]
name = "take-qc"
version = "0.1.0"
description = "Local, model-free first pass over generated video takes: format, motion, camera, cuts/dissolves, and a review packet for the host's own vision"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.9"]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
take-qc = "take_qc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/take_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
