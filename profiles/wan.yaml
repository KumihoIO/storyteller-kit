# Model profiles for provider family 'wan'.
# Baseline profiles, first extracted from the 9miho provider manifests.
# Raise `version` with any edit that can change a rendered prompt (schemas/README.md).
provider: wan
profiles:
  - id: wan.first_last_to_video
    version: 1
    label: "Wan 3.0"
    model: wan3.0-video
    aliases: []
    dialect: cinematic_prose
    identity_from_reference: false
    timed: true
    max_chars: 20000
    inputs:
      - {name: image, type: image, role: first_frame, min_count: 1, max_count: 1, ordered: false}
      - {name: last_frame, type: image, role: last_frame, min_count: 1, max_count: 1, ordered: false}
    mention_refs: []
  - id: wan.image_to_video
    version: 1
    label: "Wan 3.0"
    model: wan3.0-video
    aliases: []
    dialect: cinematic_prose
    identity_from_reference: false
    timed: true
    max_chars: 20000
    inputs:
      - {name: image, type: image, role: first_frame, min_count: 1, max_count: 1, ordered: false}
    mention_refs: []
  - id: wan.reference_to_video
    version: 1
    label: "Wan 3.0"
    model: wan3.0-video
    aliases: []
    dialect: cinematic_prose
    identity_from_reference: true
    timed: true
    max_chars: 20000
    inputs:
      - {name: refs, type: image, role: reference_image, min_count: 0, max_count: 10, ordered: true}
      - {name: reference_video, type: video, role: reference_video, min_count: 0, max_count: 5, ordered: true}
      - {name: reference_audio, type: audio, role: reference_audio, min_count: 0, max_count: 5, ordered: true}
    mention_refs:
      - {label: Image, ports: [refs]}
      - {label: Video, ports: [reference_video]}
      - {label: Audio, ports: [reference_audio]}
  - id: wan.text_to_video
    version: 1
    label: "Wan 3.0"
    model: wan3.0-video
    aliases: []
    dialect: cinematic_prose
    identity_from_reference: false
    timed: true
    max_chars: 20000
    inputs: []
    mention_refs: []
